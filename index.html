<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Calculator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        /* Glassmorphic backdrop effect */
        .glass-panel {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Custom scrollbar for history */
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.6);
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(100, 116, 139, 0.5);
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, 0.8);
        }

        /* Button Active Press Animation */
        .btn-press {
            transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .btn-press:active, .btn-pressed-kb {
            transform: scale(0.94);
            filter: brightness(1.25);
        }

        /* History drawer smooth transition */
        .history-drawer {
            transition: transform 0.3s ease-in-out, opacity 0.3s ease-in-out;
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 sm:p-6 overflow-x-hidden">

    <!-- Main Container -->
    <div class="relative w-full max-w-sm sm:max-w-md bg-slate-900/90 rounded-3xl shadow-2xl border border-slate-800 overflow-hidden glass-panel flex flex-col justify-between">
        
        <!-- Header Bar -->
        <div class="flex items-center justify-between px-6 pt-5 pb-2 text-slate-400">
            <div class="flex items-center gap-2">
                <i class="fa-solid fa-calculator text-indigo-400 text-lg"></i>
                <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Calculator</span>
            </div>
            
            <div class="flex items-center gap-3">
                <button id="history-toggle" title="Toggle History (Alt+H)" class="hover:text-indigo-400 transition-colors p-2 rounded-lg hover:bg-slate-800/60 focus:outline-none">
                    <i class="fa-solid fa-clock-rotate-left text-base"></i>
                </button>
            </div>
        </div>

        <!-- Display Area -->
        <div class="px-6 py-4 flex flex-col items-end justify-end min-h-[140px] text-right break-all">
            <!-- Top sub-display: expression history line -->
            <div id="expression-display" class="text-sm sm:text-base text-slate-400 font-normal min-h-[1.5rem] tracking-wide transition-all overflow-x-auto max-w-full"></div>
            <!-- Main Display line for current input/result -->
            <div id="main-display" class="text-4xl sm:text-5xl font-bold text-slate-50 tracking-tight mt-1 transition-all">0</div>
        </div>

        <!-- Collapsible History Overlay -->
        <div id="history-panel" class="history-drawer absolute inset-0 bg-slate-900/95 backdrop-blur-md z-20 flex flex-col transform translate-y-full opacity-0 pointer-events-none transition-all duration-300">
            <!-- History Header -->
            <div class="flex items-center justify-between p-5 border-b border-slate-800">
                <h3 class="font-semibold text-slate-200 flex items-center gap-2">
                    <i class="fa-solid fa-clock-rotate-left text-indigo-400"></i> Calculation History
                </h3>
                <div class="flex items-center gap-2">
                    <button id="clear-history-btn" title="Clear History" class="text-slate-400 hover:text-red-400 text-sm px-2.5 py-1.5 rounded-lg hover:bg-slate-800 transition">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                    <button id="close-history-btn" title="Close" class="text-slate-400 hover:text-slate-200 p-2 rounded-lg hover:bg-slate-800 transition">
                        <i class="fa-solid fa-xmark text-lg"></i>
                    </button>
                </div>
            </div>

            <!-- History Items List -->
            <div id="history-list" class="flex-1 overflow-y-auto p-4 space-y-3 custom-scrollbar">
                <!-- Dynamic Content or Empty State -->
            </div>
        </div>

        <!-- Keypad Grid -->
        <div class="p-5 grid grid-cols-4 gap-3 bg-slate-950/40 border-t border-slate-800/80">
            
            <!-- Row 1 -->
            <button data-action="clear-all" class="btn-press py-3.5 sm:py-4 rounded-2xl bg-slate-800/90 hover:bg-slate-700/80 text-rose-400 font-semibold text-lg sm:text-xl shadow-md border border-slate-700/50">C</button>
            <button data-action="clear-entry" class="btn-press py-3.5 sm:py-4 rounded-2xl bg-slate-800/90 hover:bg-slate-700/80 text-amber-400 font-semibold text-lg sm:text-xl shadow-md border border-slate-700/50">CE</button>
            <button data-action="percent" class="btn-press py-3.5 sm:py-4 rounded-2xl bg-slate-800/90 hover:bg-slate-700/80 text-indigo-300 font-medium text-lg sm:text-xl shadow-md border border-slate-700/50">%</button>
            <button data-action="operator" data-val="/" class="btn-press py-3.5 sm:py-4 rounded-2xl bg-indigo-600/90 hover:bg-indigo-500 text-white font-semibold text-xl shadow-md shadow-indigo-900/30">÷</button>

            <!-- Row 2 -->
            <button data-action="number" data-val="7" class="btn-press py-3.5 sm:py-4 rounded-2xl bg-slate-800/50 hover:bg-slate-700/60 text-slate-100 font-medium text-xl shadow border border-slate-800">7</button>
            <button data-action="number" data-val="8" class="btn-press py-3.5 sm:py-4 rounded-2xl bg-slate-800/50 hover:bg-slate-700/60 text-slate-100 font-medium text-xl shadow border border-slate-800">8</button>
            <button data-action="number" data-val="9" class="btn-press py-3.5 sm:py-4 rounded-2xl bg-slate-800/50 hover:bg-slate-700/60 text-slate-100 font-medium text-xl shadow border border-slate-800">9</button>
            <button data-action="operator" data-val="*" class="btn-press py-3.5 sm:py-4 rounded-2xl bg-indigo-600/90 hover:bg-indigo-500 text-white font-semibold text-xl shadow-md shadow-indigo-900/30">×</button>

            <!-- Row 3 -->
            <button data-action="number" data-val="4" class="btn-press py-3.5 sm:py-4 rounded-2xl bg-slate-800/50 hover:bg-slate-700/60 text-slate-100 font-medium text-xl shadow border border-slate-800">4</button>
            <button data-action="number" data-val="5" class="btn-press py-3.5 sm:py-4 rounded-2xl bg-slate-800/50 hover:bg-slate-700/60 text-slate-100 font-medium text-xl shadow border border-slate-800">5</button>
            <button data-action="number" data-val="6" class="btn-press py-3.5 sm:py-4 rounded-2xl bg-slate-800/50 hover:bg-slate-700/60 text-slate-100 font-medium text-xl shadow border border-slate-800">6</button>
            <button data-action="operator" data-val="-" class="btn-press py-3.5 sm:py-4 rounded-2xl bg-indigo-600/90 hover:bg-indigo-500 text-white font-semibold text-xl shadow-md shadow-indigo-900/30">−</button>

            <!-- Row 4 -->
            <button data-action="number" data-val="1" class="btn-press py-3.5 sm:py-4 rounded-2xl bg-slate-800/50 hover:bg-slate-700/60 text-slate-100 font-medium text-xl shadow border border-slate-800">1</button>
            <button data-action="number" data-val="2" class="btn-press py-3.5 sm:py-4 rounded-2xl bg-slate-800/50 hover:bg-slate-700/60 text-slate-100 font-medium text-xl shadow border border-slate-800">2</button>
            <button data-action="number" data-val="3" class="btn-press py-3.5 sm:py-4 rounded-2xl bg-slate-800/50 hover:bg-slate-700/60 text-slate-100 font-medium text-xl shadow border border-slate-800">3</button>
            <button data-action="operator" data-val="+" class="btn-press py-3.5 sm:py-4 rounded-2xl bg-indigo-600/90 hover:bg-indigo-500 text-white font-semibold text-xl shadow-md shadow-indigo-900/30">+</button>

            <!-- Row 5 -->
            <button data-action="toggle-sign" class="btn-press py-3.5 sm:py-4 rounded-2xl bg-slate-800/50 hover:bg-slate-700/60 text-slate-300 font-medium text-lg sm:text-xl shadow border border-slate-800">+/−</button>
            <button data-action="number" data-val="0" class="btn-press py-3.5 sm:py-4 rounded-2xl bg-slate-800/50 hover:bg-slate-700/60 text-slate-100 font-medium text-xl shadow border border-slate-800">0</button>
            <button data-action="decimal" class="btn-press py-3.5 sm:py-4 rounded-2xl bg-slate-800/50 hover:bg-slate-700/60 text-slate-100 font-medium text-xl shadow border border-slate-800">.</button>
            <button data-action="calculate" class="btn-press py-3.5 sm:py-4 rounded-2xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-2xl shadow-lg shadow-emerald-950/40">=</button>

            <!-- Row 6: Backspace full-width auxiliary row button -->
            <button data-action="backspace" class="btn-press col-span-4 py-2.5 rounded-xl bg-slate-800/40 hover:bg-slate-800/70 text-slate-400 hover:text-slate-200 text-sm font-medium transition flex items-center justify-center gap-2 border border-slate-800/60">
                <i class="fa-solid fa-delete-left text-base"></i> Backspace
            </button>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        /**
         * State Architecture for the Calculator Application
         */
        const state = {
            currentValue: '0',
            previousValue: null,
            operator: null,
            awaitingNextInput: false,
            expression: '',
            isError: false,
            history: []
        };

        // UI DOM Element references
        const mainDisplayEl = document.getElementById('main-display');
        const expressionDisplayEl = document.getElementById('expression-display');
        const historyPanelEl = document.getElementById('history-panel');
        const historyListEl = document.getElementById('history-list');
        const historyToggleBtn = document.getElementById('history-toggle');
        const closeHistoryBtn = document.getElementById('close-history-btn');
        const clearHistoryBtn = document.getElementById('clear-history-btn');

        // Operators mapping for clean displays
        const operatorSymbols = {
            '+': '+',
            '-': '−',
            '*': '×',
            '/': '÷'
        };

        /**
         * Update display elements according to state
         */
        function updateDisplay() {
            // Adjust main display text size dynamically if input length gets long
            const length = state.currentValue.length;
            if (length > 13) {
                mainDisplayEl.className = 'text-2xl sm:text-3xl font-bold text-slate-50 tracking-tight mt-1 transition-all';
            } else if (length > 9) {
                mainDisplayEl.className = 'text-3xl sm:text-4xl font-bold text-slate-50 tracking-tight mt-1 transition-all';
            } else {
                mainDisplayEl.className = 'text-4xl sm:text-5xl font-bold text-slate-50 tracking-tight mt-1 transition-all';
            }

            // Display formatting (avoid formatting long unparseable raw string states or errors)
            if (state.isError) {
                mainDisplayEl.textContent = state.currentValue;
                mainDisplayEl.classList.add('text-rose-400');
            } else {
                mainDisplayEl.classList.remove('text-rose-400');
                mainDisplayEl.textContent = formatDisplayNumber(state.currentValue);
            }

            expressionDisplayEl.textContent = state.expression;
        }

        /**
         * Format numeric strings nicely with commas forThousands Separator
         */
        function formatDisplayNumber(numberStr) {
            if (numberStr === '' || numberStr === undefined) return '0';
            if (isNaN(numberStr) || numberStr === 'Error' || numberStr === 'Cannot divide by 0') {
                return numberStr;
            }
            
            const parts = numberStr.split('.');
            const integerPart = parts[0];
            const decimalPart = parts.length > 1 ? '.' + parts[1] : '';

            // Handle optional negative prefix during formatting
            let formattedInt = '';
            if (integerPart === '-0') {
                formattedInt = '-0';
            } else if (integerPart === '-') {
                formattedInt = '-';
            } else {
                const num = parseFloat(integerPart);
                formattedInt = isNaN(num) ? integerPart : num.toLocaleString('en-US');
            }

            return formattedInt + decimalPart;
        }

        /**
         * Handle numerical digits input
         */
        function handleDigit(digit) {
            if (state.isError) resetAll();

            if (state.awaitingNextInput) {
                state.currentValue = digit;
                state.awaitingNextInput = false;
            } else {
                if (state.currentValue === '0') {
                    state.currentValue = digit;
                } else {
                    // Restrict entry length for UI consistency
                    if (state.currentValue.replace(/[^0-9]/g, '').length < 15) {
                        state.currentValue += digit;
                    }
                }
            }
            updateDisplay();
        }

        /**
         * Handle decimal point input
         */
        function handleDecimal() {
            if (state.isError) resetAll();

            if (state.awaitingNextInput) {
                state.currentValue = '0.';
                state.awaitingNextInput = false;
                updateDisplay();
                return;
            }

            if (!state.currentValue.includes('.')) {
                state.currentValue += '.';
            }
            updateDisplay();
        }

        /**
         * Handle operator selection (+, -, *, /)
         */
        function handleOperator(nextOperator) {
            if (state.isError) resetAll();

            const inputValue = parseFloat(state.currentValue);

            if (state.operator && state.awaitingNextInput) {
                // Change current chosen operator before typing next number
                state.operator = nextOperator;
                state.expression = `${formatDisplayNumber(state.previousValue.toString())} ${operatorSymbols[nextOperator]}`;
                updateDisplay();
                return;
            }

            if (state.previousValue === null) {
                state.previousValue = inputValue;
            } else if (state.operator) {
                const result = calculateResult();
                if (state.isError) return;
                
                state.previousValue = result;
                state.currentValue = String(result);
            }

            state.awaitingNextInput = true;
            state.operator = nextOperator;
            state.expression = `${formatDisplayNumber(state.previousValue.toString())} ${operatorSymbols[nextOperator]}`;
            updateDisplay();
        }

        /**
         * Core Calculation Evaluation
         */
        function calculateResult() {
            const prev = parseFloat(state.previousValue);
            const current = parseFloat(state.currentValue);

            if (isNaN(prev) || isNaN(current)) return current;

            let result = 0;

            switch (state.operator) {
                case '+':
                    result = prev + current;
                    break;
                case '-':
                    result = prev - current;
                    break;
                case '*':
                    result = prev * current;
                    break;
                case '/':
                    if (current === 0) {
                        setError('Cannot divide by 0');
                        return null;
                    }
                    result = prev / current;
                    break;
                default:
                    return current;
            }

            // Fix floating point precision bugs (e.g. 0.1 + 0.2 = 0.30000000000000004)
            result = Math.round(result * 1e12) / 1e12;
            return result;
        }

        /**
         * Trigger final evaluation (= key)
         */
        function handleEqual() {
            if (state.isError || !state.operator || state.previousValue === null) return;

            const prevStr = state.previousValue.toString();
            const currStr = state.currentValue;
            const opSymbol = operatorSymbols[state.operator];

            const result = calculateResult();

            if (!state.isError && result !== null) {
                const fullExpr = `${formatDisplayNumber(prevStr)} ${opSymbol} ${formatDisplayNumber(currStr)} =`;
                const resultStr = String(result);

                // Add calculation to History
                addHistoryItem({
                    expression: fullExpr,
                    result: resultStr
                });

                state.expression = fullExpr;
                state.currentValue = resultStr;
                state.previousValue = null;
                state.operator = null;
                state.awaitingNextInput = true;
                updateDisplay();
            }
        }

        /**
         * Toggle positive/negative sign (+/-)
         */
        function handleToggleSign() {
            if (state.isError || state.currentValue === '0') return;

            if (state.currentValue.startsWith('-')) {
                state.currentValue = state.currentValue.slice(1);
            } else {
                state.currentValue = '-' + state.currentValue;
            }
            updateDisplay();
        }

        /**
         * Handle percentage logic (%)
         */
        function handlePercent() {
            if (state.isError) return;

            let num = parseFloat(state.currentValue);
            if (isNaN(num)) return;

            if (state.previousValue !== null && state.operator) {
                // If in an operation, percentage applies as percentage of the base value
                num = (state.previousValue * num) / 100;
            } else {
                // Direct percentage conversion
                num = num / 100;
            }

            state.currentValue = String(Math.round(num * 1e12) / 1e12);
            updateDisplay();
        }

        /**
         * Backspace / Delete last character
         */
        function handleBackspace() {
            if (state.isError) {
                resetAll();
                return;
            }

            if (state.awaitingNextInput) return;

            if (state.currentValue.length === 1 || (state.currentValue.length === 2 && state.currentValue.startsWith('-'))) {
                state.currentValue = '0';
            } else {
                state.currentValue = state.currentValue.slice(0, -1);
            }
            updateDisplay();
        }

        /**
         * Clear Entry (CE) - resets current number line only
         */
        function handleClearEntry() {
            if (state.isError) {
                resetAll();
                return;
            }
            state.currentValue = '0';
            updateDisplay();
        }

        /**
         * Reset state completely (C button)
         */
        function resetAll() {
            state.currentValue = '0';
            state.previousValue = null;
            state.operator = null;
            state.awaitingNextInput = false;
            state.expression = '';
            state.isError = false;
            updateDisplay();
        }

        /**
         * Display state error messages
         */
        function setError(message) {
            state.currentValue = message;
            state.expression = '';
            state.isError = true;
            updateDisplay();
        }

        /**
         * Append items to computation history
         */
        function addHistoryItem(item) {
            state.history.unshift(item); // Add newest first
            renderHistory();
        }

        /**
         * Render calculation history entries into the panel UI
         */
        function renderHistory() {
            if (state.history.length === 0) {
                historyListEl.innerHTML = `
                    <div class="h-full flex flex-col items-center justify-center text-slate-500 py-12">
                        <i class="fa-solid fa-box-open text-3xl mb-2 opacity-50"></i>
                        <p class="text-sm">No calculations yet</p>
                    </div>
                `;
                return;
            }

            historyListEl.innerHTML = state.history.map((item, index) => `
                <div data-history-idx="${index}" class="history-item p-3 rounded-xl bg-slate-800/40 hover:bg-slate-800 border border-slate-800/80 cursor-pointer transition flex flex-col items-end group">
                    <span class="text-xs text-slate-400 group-hover:text-indigo-300 transition-colors">${item.expression}</span>
                    <span class="text-xl font-bold text-slate-100 mt-0.5">${formatDisplayNumber(item.result)}</span>
                </div>
            `).join('');

            // Add click events to reuse historical items
            document.querySelectorAll('.history-item').forEach(el => {
                el.addEventListener('click', () => {
                    const idx = el.getAttribute('data-history-idx');
                    const selected = state.history[idx];
                    if (selected) {
                        state.currentValue = selected.result;
                        state.isError = false;
                        updateDisplay();
                        toggleHistory(false);
                    }
                });
            });
        }

        /**
         * Toggle calculation history overlay drawer
         */
        function toggleHistory(show) {
            const shouldShow = show !== undefined ? show : historyPanelEl.classList.contains('translate-y-full');
            if (shouldShow) {
                historyPanelEl.classList.remove('translate-y-full', 'opacity-0', 'pointer-events-none');
                historyPanelEl.classList.add('translate-y-0', 'opacity-100', 'pointer-events-auto');
            } else {
                historyPanelEl.classList.remove('translate-y-0', 'opacity-100', 'pointer-events-auto');
                historyPanelEl.classList.add('translate-y-full', 'opacity-0', 'pointer-events-none');
            }
        }

        // ==========================================
        // Event Listeners Initialization
        // ==========================================

        // History UI Controls
        historyToggleBtn.addEventListener('click', () => toggleHistory());
        closeHistoryBtn.addEventListener('click', () => toggleHistory(false));
        clearHistoryBtn.addEventListener('click', () => {
            state.history = [];
            renderHistory();
        });

        // Keypad Mouse/Touch Click Delegation
        document.querySelectorAll('button[data-action]').forEach(button => {
            button.addEventListener('click', () => {
                const action = button.getAttribute('data-action');
                const val = button.getAttribute('data-val');

                switch (action) {
                    case 'number':
                        handleDigit(val);
                        break;
                    case 'decimal':
                        handleDecimal();
                        break;
                    case 'operator':
                        handleOperator(val);
                        break;
                    case 'calculate':
                        handleEqual();
                        break;
                    case 'clear-all':
                        resetAll();
                        break;
                    case 'clear-entry':
                        handleClearEntry();
                        break;
                    case 'backspace':
                        handleBackspace();
                        break;
                    case 'toggle-sign':
                        handleToggleSign();
                        break;
                    case 'percent':
                        handlePercent();
                        break;
                }
            });
        });

        /**
         * Physical Keyboard Shortcuts Support
         */
        window.addEventListener('keydown', (event) => {
            const { key, altKey } = event;

            // Toggle history shortcut (Alt + H)
            if (altKey && (key === 'h' || key === 'H')) {
                event.preventDefault();
                toggleHistory();
                return;
            }

            // Number Keys 0-9
            if (/^[0-9]$/.test(key)) {
                event.preventDefault();
                handleDigit(key);
                highlightButton(`[data-action="number"][data-val="${key}"]`);
            }
            // Decimal Key
            else if (key === '.' || key === ',') {
                event.preventDefault();
                handleDecimal();
                highlightButton('[data-action="decimal"]');
            }
            // Operators +, -, *, /
            else if (['+', '-', '*', '/'].includes(key)) {
                event.preventDefault();
                handleOperator(key);
                highlightButton(`[data-action="operator"][data-val="${key}"]`);
            }
            // Equals / Enter Key
            else if (key === 'Enter' || key === '=') {
                event.preventDefault();
                handleEqual();
                highlightButton('[data-action="calculate"]');
            }
            // Backspace Key
            else if (key === 'Backspace') {
                event.preventDefault();
                handleBackspace();
                highlightButton('[data-action="backspace"]');
            }
            // Escape Key -> Clear All
            else if (key === 'Escape') {
                event.preventDefault();
                resetAll();
                highlightButton('[data-action="clear-all"]');
            }
            // Delete Key -> Clear Entry
            else if (key === 'Delete') {
                event.preventDefault();
                handleClearEntry();
                highlightButton('[data-action="clear-entry"]');
            }
            // Percent Key %
            else if (key === '%') {
                event.preventDefault();
                handlePercent();
                highlightButton('[data-action="percent"]');
            }
        });

        /**
         * Highlight key active visual feedback when using keyboard
         */
        function highlightButton(selector) {
            const btn = document.querySelector(selector);
            if (btn) {
                btn.classList.add('btn-pressed-kb');
                setTimeout(() => {
                    btn.classList.remove('btn-pressed-kb');
                }, 120);
            }
        }

        // Initialize display state on load
        renderHistory();
        updateDisplay();
    </script>
</body>
</html>
